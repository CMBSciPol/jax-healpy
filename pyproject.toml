[build-system]
build-backend = 'hatchling.build'
requires = ['hatchling', 'hatch-vcs']

[project]
name = 'jax-healpy'
authors = [
    {name = 'Pierre Chanial', email = 'pierre.chanial@gmail.com'},
    {name = 'Simon Biquard', email = 'sbiquard@gmail.com'},
    {name = 'Artem Basyrov', email = 'artem.m.basyrov@gmail.com'},
    {name = 'Wassim Kabalan', email = 'wassim@apc.in2p3.fr'},
    {name = 'Magdy Morshed', email = 'magdy.morshed@fe.infn.it'}
]
maintainers = [
    {name = 'Pierre Chanial', email = 'pierre.chanial@gmail.com'},
    {name = 'Simon Biquard', email = 'sbiquard@gmail.com'},
    {name = 'Artem Basyrov', email = 'artem.m.basyrov@gmail.com'},
    {name = 'Magdy Morshed', email = 'magdy.morshed@fe.infn.it'},
    {name = 'Wassim Kabalan', email = 'wassim@apc.in2p3.fr'}
]
description = 'Healpix JAX implementation.'
readme = 'README.md'
keywords = [
    'scientific computing',
]
classifiers = [
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Intended Audience :: Science/Research',
    'Operating System :: OS Independent',
    'Topic :: Scientific/Engineering',
]
requires-python = '>=3.11'
license = 'GPL-3.0-or-later'
license-files = ['LICENSE']
dependencies = [
    'jax>=0.10.0',
    'jaxtyping>=0.3',
    'numpy>=2.0',
]
dynamic = ['version']

[project.optional-dependencies]
recommended = [
    's2fft',
]

[project.urls]
homepage = 'https://jax-healpy.readthedocs.io'
repository = 'https://github.com/CMBSciPol/jax-healpy'

[dependency-groups]
dev = [
    {include-group = 'docs'},
    'chex',
    'cyclopts',
    'healpy>=1.20',
    'matplotlib',
    'pandas',
    'pytest>=9.0',
    'pytest-cov',
    'pytest-mock',
    'pytest-notebook>=0.11',
    'pytest-rerunfailures',
    'pytest-xdist',
    'PyYAML',
]
docs = [
    'jupyter>=1.0',
    'mkdocstrings-python>=2.0',
    'zensical>=0.1',
]
cuda = ['jax[cuda13]>=0.10.0']

[tool.uv.sources]
s2fft = { git = "https://github.com/astro-informatics/s2fft" }

[tool.hatch.version]
source = 'vcs'

[tool.coverage.report]
exclude_also = [
    'pragma: no cover',
    'except ImportError:',
    'raise NotImplementedError',
    'if typing.TYPE_CHECKING:',
]
show_missing = true
skip_covered = true

[tool.pytest]
addopts = [
    '-rfEX',
    '--cov=jax_healpy',
    '--doctest-modules',
    '-m', 'not slow',
]
minversion = "9"
strict = true
testpaths = [
    'tests',
    'docs/user-guide',
]
nb_test_files = true
nb_diff_ignore = [
    '/cells/*/execution_count',
    '/cells/*/outputs',
    '/metadata/language_info',
]
markers = [
    "slow: marks tests as slow (deselected by default in CI)",
]

[tool.ruff]
line-length = 120
fix = true           # autofix issues
force-exclude = true # useful with ruff-pre-commit plugin

[tool.ruff.lint]
extend-select = [
    'B',      # flake8-bugbear
    'C4',     # flake8-comprehensions
    'I',      # isort
    'UP',     # pyupgrade
    'T10',    # flake8-debugger
]
ignore = [
    'B905', # zip() without strict=
    'RUF022', # unsorted __all__
]

[tool.ruff.format]
quote-style = 'single'
