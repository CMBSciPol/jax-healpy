name: CI

permissions: {}

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels its outdated run; pushes to main each get their own group
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The cache of uv is left to the test jobs: this job only downloads prek
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.19"
          enable-cache: false

      # The environments of the hooks only change with their configuration
      - name: Cache the environments of the hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The hooks group only holds prek, at the version locked by uv.lock: neither the project
      # nor its dependencies are installed.
      - name: Run hooks
        run: uv run --locked --only-group hooks prek run --all-files --show-diff-on-failure --color=always

  test:
    name: Run tests on Python ${{ matrix.python.version }}${{ matrix.suffix }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each Python version is tested with the oldest supported JAX minor version, in its
        # latest patch release, except the most recent Python, tested with the latest JAX.
        python:
          - version: "3.11"
            jax: ">=0.10,<0.11"
          - version: "3.12"
            jax: ">=0.10,<0.11"
          - version: "3.13"
            jax: ">=0.10,<0.11"
          - version: "3.14"
            jax: ">=0.12"
        # The libraries of the spherical harmonic transforms: ducc0 (cpu) and s2fft (gpu)
        extras: ["--extra cpu --extra gpu"]
        include:
          # The installation for CPU, in which s2fft is missing
          - python:
              version: "3.14"
              jax: ">=0.12"
            extras: "--extra cpu"
            suffix: ", without s2fft"

    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and set up environment
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.19"
          enable-cache: true
          python-version: ${{ matrix.python.version }}

      - name: Install dependencies
        env:
          EXTRAS: ${{ matrix.extras }}
        # EXTRAS holds several options: it is split into words on purpose
        run: uv sync --locked --group dev ${EXTRAS}

      # Override the locked JAX version. The following steps use --no-sync, so that uv run
      # does not reinstall the locked version.
      - name: Install JAX ${{ matrix.python.jax }}
        env:
          JAX_SPEC: ${{ matrix.python.jax }}
        run: |
          uv pip install "jax${JAX_SPEC}" "jaxlib${JAX_SPEC}"
          uv run --no-sync python -c "import jax, jaxlib; print('jax', jax.__version__, 'jaxlib', jaxlib.__version__)"

      # JAX writes every program it compiles to a persistent cache, whatever its compilation
      # time. An entry of the cache is valid only for the versions of JAX and of its backend,
      # and for the CPU that compiled it: the runners have several CPU models, each with its
      # own cache.
      - name: Configure the compilation cache of JAX
        id: jax-cache-config
        env:
          VARIANT: ${{ matrix.extras == '--extra cpu' && 'cpu' || 'cpu-gpu' }}
          PYTHON_VERSION: ${{ matrix.python.version }}
          LOCK_HASH: ${{ hashFiles('uv.lock') }}
        run: |
          echo "JAX_COMPILATION_CACHE_DIR=${RUNNER_TEMP}/jax-cache" >> "$GITHUB_ENV"
          echo "JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS=0" >> "$GITHUB_ENV"
          jax_version=$(uv run --no-sync python -c "import jax; print(jax.__version__)")
          cpu=$(grep -m 1 'model name' /proc/cpuinfo | cut -d : -f 2 | xargs | tr -cs 'A-Za-z0-9\n' '-')
          echo "prefix=jax-${RUNNER_OS}-${cpu}-py${PYTHON_VERSION}-${VARIANT}-jax${jax_version}-${LOCK_HASH}" >> "$GITHUB_OUTPUT"

      # An entry per state of the sources and the tests. When they change, the latest entry of
      # the job is restored, and the programs that did not change are not compiled again.
      - name: Restore the compilation cache of JAX
        id: jax-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.JAX_COMPILATION_CACHE_DIR }}
          key: ${{ steps.jax-cache-config.outputs.prefix }}-${{ hashFiles('jax_healpy/**', 'tests/**') }}
          restore-keys: ${{ steps.jax-cache-config.outputs.prefix }}-

      # The memory used on the runner is sampled every 10 s and its peak is printed after the
      # tests: a runner that runs out of memory stops without a log. The number of entries of
      # the compilation cache, before and after the tests, tells how many programs were compiled.
      - name: Run tests
        run: |
          grep -m 1 'model name' /proc/cpuinfo
          free -m
          echo "Entries of the compilation cache: $(find "${JAX_COMPILATION_CACHE_DIR}" -type f 2>/dev/null | wc -l)"
          while sleep 10; do free -m | awk '/^Mem:/ {print $3}'; done > "${RUNNER_TEMP}/memory.log" &
          trap 'kill $!' EXIT
          uv run --no-sync pytest -vv -n auto -m "not slow"

      - name: Show the peak memory used during the tests
        if: ${{ !cancelled() }}
        run: |
          echo "Peak memory used: $(sort -n "${RUNNER_TEMP}/memory.log" | tail -n 1) MB"
          echo "Entries of the compilation cache: $(find "${JAX_COMPILATION_CACHE_DIR}" -type f | wc -l)"

      - name: Save the compilation cache of JAX
        if: ${{ !cancelled() && steps.jax-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.JAX_COMPILATION_CACHE_DIR }}
          key: ${{ steps.jax-cache.outputs.cache-primary-key }}

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Build the site
        run: uv run --locked --group docs --no-dev --extra cpu sh docs/build.sh
