name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Set up prek and run hooks
        uses: j178/prek-action@v3.0.0
        with:
          prek-version: "0.5.3"

  test:
    name: Run tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Install uv and set up environment
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev --extra recommended

      # Most of the suite's wall time is XLA compilation of the s2fft transforms, which does not
      # change between runs. Entries are keyed on the jaxlib version too, so the lockfile is part
      # of the cache key; a test that compiles something new simply misses.
      - name: Cache compiled XLA executables
        uses: actions/cache@v6.1.0
        with:
          path: .pytest_cache/jax
          key: jax-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            jax-${{ matrix.python-version }}-

      - name: Run tests
        run: uv run pytest -vv -n auto -m "not slow"
