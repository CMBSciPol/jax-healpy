name: CI

permissions: {}

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels its outdated run; pushes to main each get their own group
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up prek and run hooks
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: "0.5.3"

  test:
    name: Run tests on Python ${{ matrix.python.version }} with JAX ${{ matrix.python.jax }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each Python version is tested with the oldest supported JAX minor version, in its
        # latest patch release, except the most recent Python, tested with the latest JAX.
        python:
          - version: "3.11"
            jax: ">=0.10,<0.11"
          - version: "3.12"
            jax: ">=0.10,<0.11"
          - version: "3.13"
            jax: ">=0.10,<0.11"
          - version: "3.14"
            jax: ">=0.12"

    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and set up environment
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
          python-version: ${{ matrix.python.version }}

      - name: Install dependencies
        run: uv sync --locked --group dev --extra recommended

      # Override the locked JAX version. The following steps use --no-sync, so that uv run
      # does not reinstall the locked version.
      - name: Install JAX ${{ matrix.python.jax }}
        env:
          JAX_SPEC: ${{ matrix.python.jax }}
        run: |
          uv pip install "jax${JAX_SPEC}" "jaxlib${JAX_SPEC}"
          uv run --no-sync python -c "import jax, jaxlib; print('jax', jax.__version__, 'jaxlib', jaxlib.__version__)"

      - name: Run tests
        run: uv run --no-sync pytest -vv -n auto -m "not slow"

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Build the site
        run: uv run --locked --group docs --no-dev --extra recommended sh docs/build.sh
