name: CI

permissions: {}

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels its outdated run; pushes to main each get their own group
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up prek and run hooks
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: "0.5.3"

  test:
    name: Run tests on Python ${{ matrix.python.version }}${{ matrix.suffix }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each Python version is tested with the oldest supported JAX minor version, in its
        # latest patch release, except the most recent Python, tested with the latest JAX.
        python:
          - version: "3.11"
            jax: ">=0.10,<0.11"
          - version: "3.12"
            jax: ">=0.10,<0.11"
          - version: "3.13"
            jax: ">=0.10,<0.11"
          - version: "3.14"
            jax: ">=0.12"
        # The libraries of the spherical harmonic transforms: ducc0 (cpu) and s2fft (gpu)
        extras: ["--extra cpu --extra gpu"]
        include:
          # The installation for CPU, in which s2fft is missing
          - python:
              version: "3.14"
              jax: ">=0.12"
            extras: "--extra cpu"
            suffix: ", without s2fft"

    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and set up environment
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.19"
          enable-cache: true
          python-version: ${{ matrix.python.version }}

      - name: Install dependencies
        env:
          EXTRAS: ${{ matrix.extras }}
        # EXTRAS holds several options: it is split into words on purpose
        run: uv sync --locked --group dev ${EXTRAS}

      # Override the locked JAX version. The following steps use --no-sync, so that uv run
      # does not reinstall the locked version.
      - name: Install JAX ${{ matrix.python.jax }}
        env:
          JAX_SPEC: ${{ matrix.python.jax }}
        run: |
          uv pip install "jax${JAX_SPEC}" "jaxlib${JAX_SPEC}"
          uv run --no-sync python -c "import jax, jaxlib; print('jax', jax.__version__, 'jaxlib', jaxlib.__version__)"

      - name: Run tests
        run: uv run --no-sync pytest -vv -n auto -m "not slow"

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Build the site
        run: uv run --locked --group docs --no-dev --extra cpu sh docs/build.sh
