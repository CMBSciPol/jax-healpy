# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    install:
      - pip install uv
    build:
      html:
        # Execute the notebooks, build the site and adjust the layout breakpoint
        - uv run --locked --group docs --no-dev --extra cpu --extra gpu sh docs/build.sh
    post_build:
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp --recursive site/* $READTHEDOCS_OUTPUT/html/

submodules:
  include: all
  recursive: true
